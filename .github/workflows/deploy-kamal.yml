name: Deploy (Kamal)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: string
      tailscale_hosts:
        description: 'Comma-separated Tailscale host addresses (e.g. "host1,host2")'
        required: false
        type: string
        default: ""
      runner:
        description: >-
          Runner label for every job, e.g. ubuntu-26.04. Defaults to ubuntu-latest, which
          follows GitHub's current Ubuntu image.
        required: false
        default: 'ubuntu-latest'
        type: string
      sha:
        description: >-
          Full commit SHA to deploy on a manual dispatch, instead of the dispatched branch's tip.
          It must be reachable from that branch. Empty deploys the tip, as before.
        required: false
        default: ""
        type: string

permissions:
  contents: read
  packages: write
  deployments: write

jobs:
  deploy:
    # GitHub creates an environment's deployment record from github.sha, the branch tip on a
    # dispatch. When an older commit is named, skip that record and write one for the commit
    # that actually ships (the "Record deployment" steps below).
    environment:
      name: ${{ inputs.environment }}
      deployment: ${{ inputs.sha == '' || github.event_name == 'workflow_run' }}
    runs-on: ${{ inputs.runner }}

    permissions:
      contents: read
      packages: write
      id-token: write
      deployments: write

    env:
      OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_DEPLOYMENT_TOKEN }}

    steps:
      # On workflow_run, github.sha is the branch tip, not the commit CI passed on.
      # Deploy the CI-passed commit, and skip if a newer commit has since landed:
      # that commit's own CI run triggers its own deploy, so an older commit never
      # deploys over a newer one.
      - name: Resolve commit to deploy
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          DEFAULT_SHA: ${{ github.sha }}
          REQUESTED_SHA: ${{ inputs.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT_NAME" != "workflow_run" ] && [ -n "$REQUESTED_SHA" ]; then
            if ! printf '%s' "$REQUESTED_SHA" | grep -Eq '^[0-9a-f]{40}$'; then
              echo "::error::sha must be a full 40-character commit SHA."
              exit 1
            fi
            # compare/<sha>...<branch> is "ahead" or "identical" only when the branch contains sha.
            STATUS=$(gh api "repos/$REPO/compare/$REQUESTED_SHA...$REF_NAME" --jq .status) || STATUS=missing
            if [ "$STATUS" != "ahead" ] && [ "$STATUS" != "identical" ]; then
              echo "::error::$REQUESTED_SHA is not on $REF_NAME (compare status: $STATUS)."
              exit 1
            fi
            echo "Deploying $REQUESTED_SHA, named on dispatch; $REF_NAME is at $DEFAULT_SHA."
            echo "sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT_NAME" != "workflow_run" ]; then
            echo "sha=$DEFAULT_SHA" >> "$GITHUB_OUTPUT"
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          TIP_SHA=$(gh api "repos/$REPO/commits/heads/$RUN_HEAD_BRANCH" --jq .sha)
          echo "sha=$RUN_HEAD_SHA" >> "$GITHUB_OUTPUT"
          if [ "$TIP_SHA" = "$RUN_HEAD_SHA" ]; then
            echo "Deploying $RUN_HEAD_SHA, the commit CI passed on."
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Skipping deploy of $RUN_HEAD_SHA: $RUN_HEAD_BRANCH has moved to $TIP_SHA, whose own CI run will trigger its deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Record deployment
        id: record
        if: inputs.sha != '' && github.event_name != 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
          ENVIRONMENT: ${{ inputs.environment }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # required_contexts is empty because CI already gated this commit's staging deploy;
          # triggered_by keeps who pressed the button, since the record's creator is the bot.
          ID=$(jq -n --arg ref "$SHA" --arg env "$ENVIRONMENT" --arg actor "$ACTOR" \
                 '{ref: $ref, environment: $env, auto_merge: false, required_contexts: [],
                   production_environment: ($env == "production"), payload: {triggered_by: $actor}}' |
               gh api "repos/$REPO/deployments" --input - --jq .id)
          echo "id=$ID" >> "$GITHUB_OUTPUT"
          jq -n --arg url "$RUN_URL" '{state: "in_progress", log_url: $url}' |
            gh api "repos/$REPO/deployments/$ID/statuses" --input - > /dev/null

      - name: Checkout repository
        if: steps.target.outputs.deploy == 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.target.outputs.sha }}

      - name: Set up correct build driver for Docker
        if: steps.target.outputs.deploy == 'true'
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Runtime for cache
        if: steps.target.outputs.deploy == 'true'
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Setup Ruby
        if: steps.target.outputs.deploy == 'true'
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Set up Tailscale
        if: steps.target.outputs.deploy == 'true'
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ inputs.tailscale_hosts }}

      - name: Set up SSH config to accept new Tailscale hosts
        if: steps.target.outputs.deploy == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "StrictHostKeyChecking accept-new" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Install 1Password CLI
        if: steps.target.outputs.deploy == 'true'
        uses: 1password/install-cli-action@v4

      - name: Build and deploy to staging
        if: steps.target.outputs.deploy == 'true' && inputs.environment == 'staging'
        run: |
          ./bin/kamal build push --output=docker -d staging
          ./bin/kamal deploy -d staging

      - name: Build and deploy to production
        if: steps.target.outputs.deploy == 'true' && inputs.environment == 'production'
        run: |
          ./bin/kamal build push --output=docker
          ./bin/kamal deploy

      - name: Finish deployment record
        if: always() && steps.record.outputs.id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ID: ${{ steps.record.outputs.id }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          STATE=$([ "$JOB_STATUS" = "success" ] && echo success || echo failure)
          jq -n --arg state "$STATE" --arg url "$RUN_URL" '{state: $state, log_url: $url}' |
            gh api "repos/$REPO/deployments/$ID/statuses" --input - > /dev/null

  notify-failure:
    name: Notify on Failure
    runs-on: ${{ inputs.runner }}
    needs: [deploy]
    if: failure()
    steps:
      - name: Send failure notification
        env:
          POSTMARK_TOKEN: ${{ secrets.POSTMARK_NOTIFICATIONS_SMTP_TOKEN }}
          WORKFLOW_FROM: ${{ secrets.WORKFLOW_FROM_EMAIL }}
          WORKFLOW_TO: ${{ secrets.WORKFLOW_TO_EMAIL }}
          # Untrusted/attacker-influenceable values are passed via env (never
          # interpolated into the script body) to prevent workflow injection.
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
          COMMIT_MSG: ${{ github.event.workflow_run.head_commit.message || github.event.head_commit.message || 'N/A' }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha || github.sha }}
          RUN_ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RESULT_DEPLOY: ${{ needs.deploy.result }}
        run: |
          SUBJECT=$(printf '\u274c GitHub Action Failed: %s \u2013 %s' "$REPO" "$WORKFLOW_NAME")
          BODY=$(cat <<BODY_EOF
          Workflow:  $WORKFLOW_NAME
          Branch:    $BRANCH_NAME
          Commit:    $COMMIT_MSG
          SHA:       $COMMIT_SHA
          Author:    $RUN_ACTOR
          Triggered: $EVENT_NAME

          Job Results:
            deploy: $RESULT_DEPLOY

          View run:  $RUN_URL
          BODY_EOF
          )
          JSON=$(jq -n \
            --arg from "$WORKFLOW_FROM" \
            --arg to "$WORKFLOW_TO" \
            --arg subject "$SUBJECT" \
            --arg body "$BODY" \
            '{From: $from, To: $to, Subject: $subject, TextBody: $body}')
          RESPONSE=$(curl -s -w "\n%{http_code}" \
            -X POST "https://api.postmarkapp.com/email" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -H "X-Postmark-Server-Token: $POSTMARK_TOKEN" \
            -d "$JSON")
          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          RESP_BODY=$(echo "$RESPONSE" | head -n -1)
          echo "Postmark response (HTTP $HTTP_CODE): $RESP_BODY"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Postmark API returned HTTP $HTTP_CODE: $RESP_BODY"
            exit 1
          fi
